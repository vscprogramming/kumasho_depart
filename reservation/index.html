<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>文化祭予約フォーム</title>
</head>
<body>
  <h1>文化祭商品予約フォーム</h1>
  <form action="/submit" method="POST">
    <label>氏名: <input type="text" name="name" required></label><br>
    <label>学年・クラス: 
      <select id="classSelect" name="class" required>
        <option value="">クラスを選択</option>
        <option value="1-A">1年A組</option>
        <option value="1-B">1年B組</option>
        <option value="2-A">2年A組</option>
      </select>
    </label><br>
    <label>商品名: 
      <select id="itemSelect" name="item" required>
        <option value="">商品を選択</option>
      </select>
    </label><br>
    <label>数量: <input type="number" name="quantity" min="1" required></label><br>
    <button type="submit">予約する</button>
  </form>

  <script>
    const classItems = {
      "1-A": { "焼きそば": 300, "ジュース": 150 },
      "1-B": { "たこ焼き": 350, "アイス": 200 },
      "2-A": { "カレー": 400, "ラムネ": 120 }
    };

    document.getElementById("classSelect").addEventListener("change", function() {
      const selectedClass = this.value;
      const itemSelect = document.getElementById("itemSelect");
      itemSelect.innerHTML = "";

      if (classItems[selectedClass]) {
        for (const item in classItems[selectedClass]) {
          const option = document.createElement("option");
          option.value = item;
          option.textContent = `${item}（${classItems[selectedClass][item]}円）`;
          itemSelect.appendChild(option);
        }
      } else {
        const option = document.createElement("option");
        option.value = "";
        option.textContent = "商品を選択";
        itemSelect.appendChild(option);
      }
    });
  </script>
</body>
</html>
