<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>販売商品一覧</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon"href="../student/img/home/kumadepa_icon.png">
</head>
<body>
  <header id="fixed-header">
    <h1>販売商品一覧</h1><!-- v0.0.2 -->
    <div id="last-updated">最終更新：--</div>
  </header>

    <div id="filter-container">
      <button id="show-all" class="active">全商品表示</button>
      <button id="show-osusume">おすすめ商品</button>  
      <button id="search-toggle">︙</button>
   </div>   

  <div id="loading-message">読み込み中です…</div>


<div id="switching-message" class="hidden">切り替え中です…</div>

  </div>

  <table id="product-table">
    <thead>
      <tr>
        <th>店舗</th>
        <th>クラス</th>  
        <th>商品名</th>
        <th>価格</th>
        <th>販売状況</th>
      </tr>
    </thead>
    <tbody id="product-list"></tbody>
  </table>

  <!-- 🔍 モーダル：検索＋絞り込み -->
  <div id="search-modal" class="hidden">
    <div class="modal-content">
      <span id="close-modal">&times;</span>
      <h2>商品検索・絞り込み</h2>

      <input type="text" id="search-input" placeholder="商品名・店舗名・クラス名で検索"><br>

      <label for="status-filter">販売状況：</label>
      <select id="status-filter">
        <option value="すべて">すべて</option>
        <option value="販売中">販売中</option>
        <option value="残りわずか">残りわずか</option>
        <option value="仕入準備中">仕入準備中</option>
        <option value="完売">完売</option>
      </select>

      <br><button id="search-button">検索</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
