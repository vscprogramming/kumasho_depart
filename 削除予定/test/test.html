<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>gas実行数制限検証サイト</title>
</head>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
        background-color: #000;
    }

    button {
        padding: 10px 20px;
        font-size: 16px;
        margin-bottom: 18px;
        cursor: pointer;
        border-radius: 34px;
        color: white;
        background-color: orange;
        width: 340px
    }

    #result {
        display: flex;
        flex-direction: row;
        gap: 10px;
    }

    .divs {
        flex: 1;
        margin-bottom: 0;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        background-color: #333;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        height: 700px;
        max-height: 700px;
        color: #eee;
    }

    #summary {
        width: 100%;
        text-align: center;
        margin-top: 30px;
        font-size: 18px;
        color: #eee;
    }

    #summary div {
        display: inline-block;
        background: #333;
        padding: 16px 32px;
        border-radius: 12px;
    }
</style>

<body>
    <center><button id="button">GAS実行</button></center>
    <div id="result">
        <!-- 7並列分のdivを生成 -->
        <div id="div1" class="divs">test1</div>
        <div id="div2" class="divs">test2</div>
        <div id="div3" class="divs">test3</div>
        <div id="div4" class="divs">test4</div>
        <div id="div5" class="divs">test5</div>
        <div id="div6" class="divs">test6</div>
        <div id="div7" class="divs">test7</div>
    </div>
    <div id="summary"></div>
    <script>
        const BUSY_COLOR = '#442222'; // ダーク赤
        const DONE_COLOR = '#223355'; // ダーク青
        const gasurl = [
            'https://script.google.com/macros/s/AKfycbxOjSZ5ZTZuES5HMarbCK50zs0RGNW4GfcQW8Wszc1p-CLJDvghrVq5-VinGZ052iJI6Q/exec',
            'https://script.google.com/macros/s/AKfycbxE11uBTKTaxOggR1JKIlLbqjDHQDppL25OU_ciEkJwb3sLF5y-Esl6chP-oQi4nelUsg/exec',
            'https://script.google.com/macros/s/AKfycbz1vV2zs9QLBilsQlqePGIu5glj4n9KZh7qaDxqya_6WdwY6-YgQbWHotqHa9wYIDHB/exec',
            'https://script.google.com/macros/s/AKfycbwqliNSeCAV2CwGgzSxrha6s7jajH6mH5wyxIyv6gZQG0qER4h5eGztD6eSy-NJuqx-/exec',
            'https://script.google.com/macros/s/AKfycbwn7Z3PJsjzkypue0WBCCZca3jkDX7Zb8iqni3H9mrwWoFRHmcYMdxx7kCwKGTeGfraGQ/exec',
            'https://script.google.com/macros/s/AKfycbzgjdof-6vHbZUVh53Dcpdo0tLca3J9AK0z2yoUkeK8zBG1y5FMzQOyQeEJkASzDtVwdw/exec',
            'https://script.google.com/macros/s/AKfycbypDF71212SS0_Q18iyckk_qH1coL12ZZcot354hpPUSt7ehgz_fRGYJCHaKtbBSLyn/exec'
        ];
        const el = id => document.getElementById(id);
        const pad = (n, z = 2) => String(n).padStart(z, '0');
        const formatTime = () => {
            const d = new Date();
            return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${pad(d.getMilliseconds(), 3)}`;
        };
        const appendLog = (div, text) => {
            const p = document.createElement('p');
            p.innerHTML = text + '<br>';
            div.appendChild(p);
            div.scrollTop = div.scrollHeight;
        };
        async function gasWorker(url, loop, divId, maxConcurrency = 20) {
            let success = 0, fail = 0, exec = 0;
            const div = el(divId);
            let idx = 1;
            async function runBatch(batch) {
                await Promise.all(batch.map(i =>
                    fetch(url)
                        .then(res => {
                            exec++;
                            if (res.ok) success++; else fail++;
                            appendLog(div, `${formatTime()}　${i}回目の処理が完了しました（${res.ok ? '成功' : '失敗'}）`);
                        })
                        .catch(() => {
                            exec++;
                            fail++;
                            appendLog(div, `${formatTime()}　${i}回目の処理が完了しました（ネットワークエラー）`);
                        })
                ));
            }
            while (idx <= loop) {
                const batch = [];
                for (let b = 0; b < maxConcurrency && idx <= loop; b++, idx++) batch.push(idx);
                await runBatch(batch);
            }
            return { success, fail, exec };
        }
        document.getElementById('button').addEventListener('click', async () => {
            for (let i = 1; i <= 7; i++) el(`div${i}`).style.backgroundColor = BUSY_COLOR;
            const loop = Number(prompt('ループ回数を入力してください', '14300')) || 0;
            const start = Date.now();
            const maxConcurrency = 20; // 並列数制限
            const workers = gasurl.map((url, i) =>
                gasWorker(url, loop, `div${i + 1}`, maxConcurrency).then(r => {
                    el(`div${i + 1}`).style.backgroundColor = DONE_COLOR;
                    return r;
                })
            );
            const results = await Promise.all(workers);
            // 集計
            const totals = results.reduce((acc, r) => {
                acc.success += r.success;
                acc.fail += r.fail;
                acc.exec += r.exec;
                return acc;
            }, { success: 0, fail: 0, exec: 0 });
            const elapsedMs = Date.now() - start;
            const hh = pad(Math.floor(elapsedMs / 3600000));
            const mm = pad(Math.floor((elapsedMs % 3600000) / 60000));
            const ss = pad(Math.floor((elapsedMs % 60000) / 1000));
            const elapsedStr = `${hh}:${mm}:${ss}`;
            // summary表示
            el('summary').innerHTML = `
                <div style='display:inline-block;background:${DONE_COLOR};padding:16px 32px;border-radius:12px;text-align:left;'>
                    <b>全体: 成功=${totals.success} 失敗=${totals.fail} 実行数=${totals.exec}</b><br>
                    ${results.map((r, i) => `<span>URL${i + 1}: 成功=${r.success} 失敗=${r.fail} 実行数=${r.exec}</span><br>`).join('')}
                    <span>経過時間: <b>${elapsedStr}</b></span>
                </div>`;
            // console出力
            console.log(`全体: 成功=${totals.success} 失敗=${totals.fail} 実行数=${totals.exec}`);
            results.forEach((r, i) =>
                console.log(`URL${i + 1}: 成功=${r.success} 失敗=${r.fail} 実行数=${r.exec}`)
            );
        });
    </script>
</body>

</html>
