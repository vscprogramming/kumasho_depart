<!DOCTYPE html>

<html lang="ja">

<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
    <title>熊デパ ログイン</title>
</head>

<style>
    /* ======= CSS 変数 ======= */
    :root {
        /* カラー */
        --color-orange: #f80;
        --color-orange-hover: #f70;

        --color-bg-mid: #333;
        --color-bg-white: #eee;
        --color-bg-dark: #121212;
        --color-bg-table: #f5f6fa;

        --color-text-dark: #333;
        --color-text-light: #eee;

        /* レイアウト */
        --radius: 18px;
        --radius-large: 34px;
        --shadow-light: 7px 7px 7px #0000000d;
        --shadow-strong: 7px 7px 7px #000000b3;
    }

    /* ======= ベース =======  */
    body {
        cursor: default;
        background: var(--color-bg-dark);
    }

    input {
        cursor: pointer;
    }

    p {
        margin: 0;
        position: absolute;
        top: 100%;
        left: 100%;
        color: var(--color-text-light);
        transform: translate(-100%, -100%);
    }

    /* ======= コンテナー ======= */
    #container {
        width: 56.7%;
        top: 50%;
        left: 50%;
        padding: 36px 24px;
        position: absolute;
        text-align: center;
        color: var(--color-text-light);
        background: var(--color-bg-mid);
        transform: translate(-50%, -50%);
        box-shadow: var(--shadow-strong);
        border-radius: var(--radius-large);
    }

    /* ======= フォーム要素 ======= */
    label.grade {
        color: var(--color-text-dark);
    }

    input:focus,
    select:focus {
        box-shadow: var(--shadow-light);
        border-color: var(--color-orange);
    }

    #grade,
    #class,
    #password {
        width: auto;
        padding: 12px;
        font-size: 1vw;
        border-radius: var(--radius);
        box-shadow: var(--shadow-light);
        border: 3px solid var(--color-orange);
        background-color: var(--color-bg-white);
    }

    #grade {
        text-align: center;
    }

    #grade,
    #password {
        width: 100%;
    }

    #class {
        width: 108%;
        cursor: pointer;
    }

    #password {
        cursor: text;
    }

    /* ======= タイトル ======= */
    h1 {
        font-size: 2.4rem;
        margin-bottom: 34px;
        color: var(--color-text-light);
    }

    /* ======= ログインボタン ======= */
    #login_button {
        margin-top: 24px;
        font-size: 1.3rem;
        padding: 12px 36px;
        text-align: center;
        font-weight: bolder;
        text-decoration: none;
        transition: all 0.3s ease;
        border-radius: var(--radius);
        color: var(--color-text-light);
        background: var(--color-orange);
        box-shadow: var(--shadow-strong);
    }

    #login_button:hover {
        cursor: pointer;
        transform: translateY(-50%, -50%);
        box-shadow: 3px 3px 3px #0000004d;
        background: var(--color-orange-hover);
    }

    /* ======= テーブル ======= */
    table {
        width: 70%;
        margin: auto;
        font-size: 130%;
    }

    table th,
    table td {
        text-align: left;
        padding: 12px 16px;
    }

    table th {
        background: var(--color-bg-table);
    }

    /* ======= ローディングスピナー ======= */
    @keyframes spin {
        0% {
            transform: rotate(0deg);
        }

        100% {
            transform: rotate(360deg);
        }
    }

    #loading {
        width: 100vw;
        height: 100vh;
        inset: 0;
        z-index: 9999;
        display: flex;
        position: fixed;
        align-items: center;
        justify-content: center;
        background: #00000080;
    }

    #spinner {
        width: 70px;
        height: 70px;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        border: 7px solid var(--color-bg-white);
        border-top: 7px solid var(--color-orange);
    }

    @media (max-width: 1400px) {
        #class {
            width: 110%;
        }
    }

    @media (min-width: 1700px) {
        #class {
            width: 107%;
        }

        #container {
            width: 50%
        }
    }

    @media (min-width: 650px) and (max-width: 800px) {
        h1 {
            font-size: 2rem;
        }

        #container {
            width: 77%;
        }

        #grade,
        #class,
        #password {
            font-size: 1.9vw;
        }
    }

    @media (min-width: 650px) and (max-width: 700px) {
        #class {
            width: 114%;
        }
    }

    @media (min-width: 700px) and (max-width: 800px) {
        #class {
            width: 113%;
        }
    }
</style>

<body id="body">
    <div id="container">
        <h1>熊商デパート　関係者ログイン</h1>

        <form>
            <table>
                <tr>
                    <td>
                        <label for="id">学年</label>
                    </td>
                    <td>
                        <div id="grade">
                            <label class="grade"><input class="grade" type="radio" name="grade" value="9"
                                    checked>9年</label>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td><label for="class">クラス</label></td>

                    <td>
                        <select id="class" name="class" required>
                            <option value="91">1組</option>
                            <option value="92">2組</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td><label for="password">パスワード</label></td>
                    <td><input type="password" id="password" name="password" placeholder="パスワードを入力してください" required></td>
                </tr>
            </table>

            <button type="submit" id="login_button">ログイン</button>
        </form>
    </div>

    <div id="loading">
        <div id="spinner"></div>
    </div>

    <p>v2.2</p> <!-- バージョン情報 -->
</body>

<script>
    let id_pass = { id: [], password: [] };

    window.addEventListener('DOMContentLoaded', async () => {
        document.getElementById('loading').style.display = 'flex';
        localStorage.removeItem('logged_91');
        localStorage.removeItem('logged_92');

        let retry_count = 1;
        while (retry_count <= 3) {
            try {
                const response = await fetch('https://script.google.com/macros/s/AKfycbwm9qu9YiNLh5xjZiHv8-rlGWA6cyH4hXXzViFWIlCNaDYlNU89DCD-QbGBVgELCYNA/exec');
                if (response.ok) {
                    const json_data = await response.json();
                    console.log(json_data);
                    json_data.forEach(json_data_row => {
                        if (["91", "92"].includes(json_data_row.class)) {
                            id_pass.id.push(json_data_row.class);
                            id_pass.password.push(json_data_row.password);
                        }
                    });
                    document.getElementById('loading').style.display = 'none';
                    console.log(id_pass);
                    return;
                } else {
                    alert(`ネットワークエラーが発生しました。\n再試行します。\n（${retry_count}/3）`);
                    retry_count++;
                }
            } catch (error) {
                alert(`ネットワークエラーが発生しました。\n再試行します。\n（${retry_count}/3）`);
                retry_count++;
            }
        }
        alert('必要な情報が読み取れませんでした。\nネットワーク接続をもう一度確認して再読み込みして下さい。\nこの表示が何度も表示される場合は開発者にお問い合わせください。\nOKをクリックすると再読み込みを行います。');
        window.location.reload();
    });

    document.querySelector('form').addEventListener('submit', async (event) => {
        event.preventDefault();

        // ローディングの表示
        document.getElementById('loading').style.display = 'flex';

        // フォーム入力の値を取得
        const id = document.getElementById('class').value;
        const password = document.getElementById('password').value;
        // console.log(`class: ${id}, password: ${password}`);

        // id探索
        let found_index = id_pass.id.indexOf(id);

        // 認証処理
        if (found_index !== -1) {
            if (password === id_pass.password[found_index]) {
                // console.log('認証成功');
                localStorage.setItem(`logged_${id}`, 'true');
                localStorage.setItem(`class_name`, `${id[0]}-${id[1]}`);
                localStorage.setItem(`class_number`, id);
                window.location.href = '../pm/pm.html';
            } else {
                // console.error('パスワードが間違っています');
                alert('パスワードが間違っています。');
                document.getElementById('password').value = '';
                document.getElementById('loading').style.display = 'none';
            }
        } else {
            // console.error('指定されたIDが見つかりません');
            alert('指定されたIDが見つかりません。');
            document.getElementById('loading').style.display = 'none';
        }
    });

    ['resize', 'DOMContentLoaded'].forEach(event => {
        window.addEventListener(event, () => {
            document.getElementById('body').style.width = innerWidth;
            document.getElementById('body').style.height = innerHeight;
        });
    });
</script>

</html>
