<!DOCTYPE html>

<html lang="ja">
    <head>
        <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
        <title>熊デパ ログイン</title>
    </head>

    <style>
        /* ======= CSS 変数 ======= */
        :root {
            /* カラー */
            --color-orange: #f80;
            --color-orange-hover: #f70;

            --color-bg-mid: #333;
            --color-bg-white: #eee;
            --color-bg-dark: #121212;
            --color-bg-table: #f5f6fa;

            --color-text-dark: #333;
            --color-text-light: #eee;

            /* レイアウト */
            --radius: 18px;
            --radius-large: 34px;
            --shadow-light: 7px 7px 7px rgba(0, 0, 0, 0.05);
            --shadow-strong: 7px 7px 7px rgba(0, 0, 0, 0.7);
        }

        /* ======= ベース =======  */
        body {
            cursor: default;
            background: var(--color-bg-dark);
        }

        input { cursor: pointer; }

        p {
            top: 100%; left: 100%;
            margin: 0;
            position: absolute;
            color: var(--color-text-light);
            transform: translate(-100%, -100%);
        }

        /* ======= コンテナー ======= */
        #container {
            top: 50%; left: 50%;
            width: 56.7%;
            padding: 36px 24px;
            position: absolute;
            text-align: center;
            color: var(--color-text-light);
            background: var(--color-bg-mid);
            transform: translate(-50%, -50%);
            box-shadow: var(--shadow-strong);
            border-radius: var(--radius-large);
        }

        /* ======= フォーム要素 ======= */
        label.grade { color: var(--color-text-dark); }

        input:focus, select:focus {
            box-shadow: var(--shadow-light);
            border-color: var(--color-orange);
        }

        #grade, #class, #password {
            padding: 12px;
            font-size: 1vw;
            border-radius: var(--radius);
            box-shadow: var(--shadow-light);
            border: 3px solid var(--color-orange);
            background-color: var(--color-bg-white);
        }

        #grade, #password { width: 100%; }

        #grade { text-align: center; }

        #class {
            width: 108%;
            cursor: pointer;
        }

        #password { cursor: text; }

        /* ======= タイトル ======= */
        h1 {
            font-size: 2.4rem;
            margin-bottom: 34px;
            color: var(--color-text-light);
        }

        /* ======= ログインボタン ======= */
        #login_button {
            margin-top: 24px;
            font-size: 1.3rem;
            padding: 12px 36px;
            text-align: center;
            font-weight: bolder;
            text-decoration: none;
            transition: all 0.3s ease;
            border-radius: var(--radius);
            color: var(--color-text-light);
            background: var(--color-orange);
            box-shadow: var(--shadow-strong);
        }

        #login_button:hover {
            cursor: pointer;
            transform: translateY(-50%, -50%);
            background: var(--color-orange-hover);
            box-shadow: 3px 3px 3px rgba(0, 0, 0, 0.3);
        }

        /* ======= テーブル ======= */
        table {
            width: 70%;
            margin: auto;
            font-size: 130%;
        }

        table th, table td {
            text-align: left;
            padding: 12px 16px;
        }

        table th { background: var(--color-bg-table); }

        /* ======= ローディングスピナー ======= */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #loading {
            width: 100vw; height: 100vh;
            top: 0; left: 0;
            z-index: 9999;
            display: flex;
            position: fixed;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.5);
        }

        #spinner {
            width: 70px; height: 70px;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            border: 7px solid var(--color-bg-white);
            border-top: 7px solid var(--color-orange);
        }
    </style>

    <body id="body">
        <div id="container">
            <h1>熊商デパート　関係者ログイン</h1>

            <form>
                <table>
                    <tr>
                        <td>
                            <label for="id">学年</label>
                        </td>

                        <td>
                            <div id="grade">
                                <label class="grade"><input class="grade" type="radio" name="grade" value="1">1年</label>
                                <label class="grade"><input class="grade" type="radio" name="grade" value="2">2年</label>
                                <label class="grade"><input class="grade" type="radio" name="grade" value="3" checked>3年</label>
                            </div>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="class">クラス</label>
                        </td>

                        <td>
                            <select id="class" name="class" required>
                                <!-- オプションはJavaScriptによって追加 -->
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="password">パスワード</label>
                        </td>

                        <td>
                            <input type="password" id="password" name="password" placeholder="パスワードを入力してください" required>
                        </td>
                    </tr>
                </table>

                <button type="submit" id="login_button">ログイン</button>
            </form>
        </div>

        <div id="loading">
            <div id="spinner"></div>
        </div>

        <p>v1.8.2</p>   <!-- バージョン情報 -->
    </body>

    <script>
        const class_options = {
            1: [
                { value: '11', text: '1組' },
                { value: '12', text: '2組' },
                { value: '13', text: '3組' },
                { value: '14', text: '4組' },
                { value: '15', text: '5組' },
                { value: '16', text: '6組' },
                { value: '17', text: '7組' },
                { value: '18', text: '8組' },
                { value: '19', text: '9組' }
            ],
            2: [
                { value: '21', text: '1組' },
                { value: '22', text: '2組' },
                { value: '23', text: '3組' },
                { value: '24', text: '4組' },
                { value: '25', text: '5組' },
                { value: '26', text: '6組' },
                { value: '27', text: '7組' },
                { value: '28', text: '8組' },
                { value: '29', text: '9組' }
            ],
            3: [
                { value: '31', text: '1組' },
                { value: '32', text: '2組' },
                { value: '33', text: '3組' },
                { value: '34', text: '4組' },
                { value: '35', text: '5組' },
                { value: '36', text: '6組' },
                { value: '37', text: '7組' },
                { value: '38', text: '8組' },
                { value: '39', text: '9組' }
            ]
        };

        let id_pass = {
            id: [],
            password: []
        };

        function update_class_options(grade) {
            document.getElementById('password').value = '';
            const select = document.getElementById('class');
            select.innerHTML = '<option value="" disabled selected>クラスを選択</option>';

            class_options[grade].forEach(cl_opt => {
                const option = document.createElement('option');
                option.value = cl_opt.value;
                option.textContent = cl_opt.text;
                select.appendChild(option);
            });
        }

        window.addEventListener('DOMContentLoaded', async () => {
            // ローディングの表示
            document.getElementById('loading').style.display = 'flex';

            // ログイン状況のリセット
            for (let g = 1; g <= 3; g++) {
                for (let c = 1; c <= 9; c++) {
                    localStorage.removeItem(`logged_${g}${c}`);
                }
            }

            // プルダウンリストの内容作成
            document.querySelectorAll('input[name="grade"]').forEach(radio => {
                radio.addEventListener('change', () => update_class_options(radio.value));
            });

            // プルダウンリストが変更されたとき、パスワード欄をリセット
            document.getElementById('class').addEventListener('change', () => document.getElementById('password').value = '');
            update_class_options(document.querySelector('input[name="grade"]:checked').value);

            // ユーザーID・パスワードの取得
            const response = await fetch('https://script.google.com/macros/s/AKfycbyK7_NC8Dmif7-ZDSDPFDOSCSrtrdVCR7MYq626vwAjBqa82d8aobkBOm8rGmlPFQHy/exec');

            if (response.ok) {
                const json_data = await response.json();
                console.log(json_data);

                // 扱いやすいデータ配列に変換
                json_data.forEach(json_data_row => {
                    id_pass.id.push(json_data_row.class);
                    id_pass.password.push(json_data_row.password);
                });
            } else {
                alert('ネットワークエラーが発生しました。\n再読み込みします。');
                window.location.reload();
            }

            // ローディングの非表示
            document.getElementById('loading').style.display = 'none';
        });

        document.querySelector('form').addEventListener('submit', async (event) => {
            event.preventDefault();

            // ローディングの表示
            document.getElementById('loading').style.display = 'flex';

            // フォーム入力の値を取得
            const id = document.getElementById('class').value;
            const password = document.getElementById('password').value;
            console.log(`class: ${id}, password: ${password}`);

            // id探索
            let found_index = id_pass.id.indexOf(id);

            // 認証処理
            if (found_index !== -1) {
                if (password === id_pass.password[found_index]) {
                    console.log('認証成功');
                    localStorage.setItem(`logged_${id}`, 'true');
                    localStorage.setItem(`class_name`, `${id[0]}-${id[1]}`);
                    localStorage.setItem(`class_number`, id);
                    window.location.href = '../product_management/product_management.html';
                } else {
                    console.error('パスワードが間違っています');
                    alert('パスワードが間違っています。');
                    document.getElementById('password').value = '';
                    document.getElementById('loading').style.display = 'none';
                }
            } else {
                console.error('指定されたIDが見つかりません');
                alert('指定されたIDが見つかりません。');
                document.getElementById('loading').style.display = 'none';
            }
        });

        ['resize', 'DOMContentLoaded'].forEach(event => {
            window.addEventListener(event, () => {
                document.getElementById('body').style.width = innerWidth;
                document.getElementById('body').style.height = innerHeight;
            });
        });
    </script>
</html>
