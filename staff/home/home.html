<!DOCTYPE html>

<html lang="ja">

<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
    <title>熊商デパ ログイン</title>
</head>

<style>
    body {
        background: #121212;
        cursor: default;
    }

    #container {
        max-width: 720px;
        min-height: 300px;
        width: 100%;
        height: auto;
        margin: 100px auto;
        padding: 36px 24px 36px 24px;
        background: #333;
        border-radius: 34px;
        box-shadow: 7px 7px 7px rgba(0, 0, 0, 0.7);
        text-align: center;
        color: #eee;
    }

    input {
        cursor: pointer;
    }

    label.grade {
        color: #000;
    }

    input:focus,
    select:focus {
        border-color: #f80;
        box-shadow: 7px 7px 7px rgba(0, 0, 0, 0.05);
    }

    h1 {
        color: #eee;
        margin-bottom: 30px;
        font-size: 2rem;
    }

    #login_button {
        background: #f80;
        color: #eee;
        text-decoration: none;
        font-size: 1.3rem;
        padding: 12px 36px;
        border-radius: 18px;
        transition: all 0.3s ease;
        box-shadow: 7px 7px 7px rgba(0, 0, 0, 0.7);
        text-align: center;
        font-weight: bolder;
        margin-top: 24px;
    }

    #login_button:hover {
        background: #f70;
        cursor: pointer;
        box-shadow: 3px 3px 3px rgba(0, 0, 0, 0.3);
        transform: translateY(-50%, -50%);
    }

    @keyframes spin {
        0% {
            transform: rotate(0deg);
        }

        100% {
            transform: rotate(360deg);
        }
    }

    table {
        width: 70%;
        font-size: 130%;
    }

    table th,
    table td {
        padding: 12px 16px;
        text-align: left;
    }

    table th {
        background: #f5f6fa;
    }

    #grade,
    #class,
    #password {
        padding: 12px;
        font-size: 1rem;
        border-radius: 18px;
        border: 3px solid #f80;
        background-color: #fff;
        box-shadow: 7px 7px 7px rgba(0, 0, 0, 0.05);
    }

    #grade,
    #password {
        width: 100%;
    }

    #grade {
        text-align: center;
    }

    #class {
        width: 110%;
        cursor: pointer;
    }

    #password {
        cursor: text;
    }

    #loading {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(0, 0, 0, 0.5);
        z-index: 2000;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    #spinner {
        border: 7px solid #fff;
        border-top: 7px solid #f39121;
        border-radius: 50%;
        width: 70px;
        height: 70px;
        animation: spin 0.7s linear infinite;
    }

    p {
        text-align: right;
        color: #eee;
    }
</style>

<body>
    <div id="container">
        <h1>熊商デパート　関係者ログイン</h1>

        <form>
            <center>
                <table>
                    <tr>
                        <td>
                            <label for="id">学年</label>
                        </td>

                        <td>
                            <div id="grade">
                                <label class="grade">
                                    <input class="grade" type="radio" name="grade" value="1">1年
                                </label>

                                <label class="grade">
                                    <input class="grade" type="radio" name="grade" value="2">2年
                                </label>

                                <label class="grade">
                                    <input class="grade" type="radio" name="grade" value="3" checked>3年
                                </label>
                            </div>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="class">クラス</label>
                        </td>

                        <td>
                            <select id="class" name="class" required>
                                <!-- オプションはJavaScriptによって追加 -->
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="password">パスワード</label>
                        </td>

                        <td>
                            <input type="password" id="password" name="password" placeholder="パスワードを入力してください" required>
                        </td>
                    </tr>
                </table>
            </center>

            <button type="submit" id="login_button">ログイン</button>
        </form>

        <div id="loading">
            <div id="spinner"></div>
        </div>
    </div>

    <p>v0.45(v0.45)(v1.3.3)</p> <!-- バージョン情報 -->

    <script>
        const class_options = {
            1: [
                { value: '11', text: '1組' },
                { value: '12', text: '2組' },
                { value: '13', text: '3組' },
                { value: '14', text: '4組' },
                { value: '15', text: '5組' },
                { value: '16', text: '6組' },
                { value: '17', text: '7組' },
                { value: '18', text: '8組' },
                { value: '19', text: '9組' }
            ],
            2: [
                { value: '21', text: '1組' },
                { value: '22', text: '2組' },
                { value: '23', text: '3組' },
                { value: '24', text: '4組' },
                { value: '25', text: '5組' },
                { value: '26', text: '6組' },
                { value: '27', text: '7組' },
                { value: '28', text: '8組' },
                { value: '29', text: '9組' }
            ],
            3: [
                { value: '31', text: '1組' },
                { value: '32', text: '2組' },
                { value: '33', text: '3組' },
                { value: '34', text: '4組' },
                { value: '35', text: '5組' },
                { value: '36', text: '6組' },
                { value: '37', text: '7組' },
                { value: '38', text: '8組' },
                { value: '39', text: '9組' }
            ]
        };

        let id_pass = {
            id: [],
            password: []
        };

        function update_class_options(grade) {
            document.getElementById('password').value = '';
            const select = document.getElementById('class');
            select.innerHTML = '<option value="" disabled selected>クラスを選択</option>';

            class_options[grade].forEach(cl_opt => {
                const option = document.createElement('option');
                option.value = cl_opt.value;
                option.textContent = cl_opt.text;
                select.appendChild(option);
            });
        };

        window.addEventListener('DOMContentLoaded', async () => {
            // ローディングの表示
            document.getElementById('loading').style.display = 'flex';

            // ログイン状況のリセット
            for (let g = 1; g <= 3; g++) {
                for (let c = 1; c <= 9; c++) {
                    localStorage.removeItem(`logged_${g}${c}`);
                };
            };

            // プルダウンリストの内容作成
            document.querySelectorAll('input[name="grade"]').forEach(radio => {
                radio.addEventListener('change', () => {
                    update_class_options(radio.value);
                });
            });

            // プルダウンリストが変更されたとき、パスワード欄をリセット
            document.getElementById('class').addEventListener('change', () => {
                document.getElementById('password').value = '';
            });

            update_class_options(document.querySelector('input[name="grade"]:checked').value);

            // ユーザーID・パスワードの取得
            const response = await fetch('https://script.google.com/macros/s/AKfycbyG279JTr01s2ietRm8QoVsFoAkvJz0yvetyoXhGN6JZ9j_fKwaYDdqlN4qwiD-nZOQ/exec');

            if (response.ok) {
                const json_data = await response.json();
                console.log(json_data);

                // 扱いやすいデータ配列に変換
                json_data.forEach(json_data_row => {
                    id_pass.id.push(json_data_row.class);
                    id_pass.password.push(json_data_row.password);
                });
            } else {
                alert('ネットワークエラーが発生しました。\n再読み込みします。');
                window.location.reload();
            };

            // ローディングの非表示
            document.getElementById('loading').style.display = 'none';
        });

        document.querySelector('form').addEventListener('submit', async (event) => {
            event.preventDefault();

            // ローディングの表示
            document.getElementById('loading').style.display = 'flex';

            // フォーム入力の値を取得
            const id = document.getElementById('class').value,
                password = document.getElementById('password').value;
            console.log(`class: ${id}, password: ${password}`);

            // id探索
            let found_index = id_pass.id.indexOf(id);

            // 認証処理（簡易的だから爆速やで）
            if (found_index !== -1) {
                if (password === id_pass.password[found_index]) {
                    console.log('認証成功');
                    localStorage.setItem(`logged_${id}`, 'true');
                    localStorage.setItem(`class_name`, `${id[0]}-${id[1]}`);
                    localStorage.setItem(`class_number`, id);
                    // サイトに移動
                    window.location.href = '../product_management/product_management.html';
                } else {
                    console.error('パスワードが間違っています');
                    alert('パスワードが間違っています。');
                    document.getElementById('password').value = '';
                    document.getElementById('loading').style.display = 'none';
                };
            } else {
                console.error('指定されたIDが見つかりません');
                alert('指定されたIDが見つかりません。');
                document.getElementById('loading').style.display = 'none';
            };
        });
    </script>
</body>

</html>
