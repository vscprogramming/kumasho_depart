<!DOCTYPE html>

<html lang="ja">
    <head>
        <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
        <title>熊商デパ ログイン</title>
    </head>

    <style>
        body {
            background: #d3e2ff;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 720px;
            width: 100%;
            min-height: 300px;
            height: auto;
            margin: 100px auto;
            background: #ffdbac;
            border-radius: 34px;
            box-shadow: 7px 7px 7px rgba(0, 0, 0, 0.7);
            padding: 36px 24px 36px 24px;
            text-align: center;
        }

        input {cursor: pointer;}

        h1 {
            color: #000000;
            margin-bottom: 24px;
            font-size: 2rem;
        }

        .main-btn {
            top: 24px;
            right: 32px;
            z-index: 1000;
            display: inline-block;
            background: #4e8cff;
            color: #fff;
            text-decoration: none;
            font-size: 1.1rem;
            padding: 12px 36px;
            border-radius: 18px;
            transition: all 0.2s ease;
            box-shadow: 7px 7px 7px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        .main-btn:hover {
            background: #2563c9;
            cursor: pointer;
            box-shadow: 3px 3px 3px rgba(0, 0, 0, 0.3);
            transform: translateY(-50%, -50%);
        }

        @keyframes spin {
            0% {transform: rotate(0deg);}
            100% {transform: rotate(360deg);}
        }

        table {
            width: 70%;
            font-size: 130%;
        }

        table th, table td {
            padding: 12px 16px;
            text-align: left;
        }

        table th {
            background: #f5f6fa;
            font-weight: bold;
        }

        .grade-select {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border-radius: 7px;
            border: 1px solid #ccc;
            background-color: #fff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .class-select {
            width: 108.7%;
            padding: 12px;
            font-size: 1rem;
            border-radius: 7px;
            border: 1px solid #ccc;
            background-color: #fff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            cursor: pointer;
        }

        .password-input {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border-radius: 7px;
            border: 1px solid #ccc;
            background-color: #fff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
            cursor: text;
        }

        .loading {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(255, 255, 255, 0.7);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spinner {
            border: 8px solid #f3f3f3;
            border-top: 8px solid #f39121;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
        }

        p {
            margin-top: 173px;
            text-align: right;
        }
    </style>

    <body>
        <div class="container">
            <h1>熊商デパート　関係者ログイン</h1>

            <form>
                <center>
                    <table>
                        <tr>
                            <td><label for="id">学年</label></td>

                            <td>
                                <div class="grade-select">
                                    <label><input type="radio" name="grade" value="1">1年</label>
                                    <label><input type="radio" name="grade" value="2">2年</label>
                                    <label><input type="radio" name="grade" value="3" checked>3年</label>
                                </div>
                            </td>
                        </tr>

                        <tr>
                            <td><label for="class">クラス</label></td>

                            <td>
                                <select id="class" name="class" class="class-select" required>
                                    <!-- オプションはJavaScriptによって追加 -->
                                </select>
                            </td>
                        </tr>

                        <tr>
                            <td><label for="password">パスワード</label></td>
                            <td><input type="password" id="password" name="password" class="password-input" required></td>
                        </tr>
                    </table>
                </center>

                <br>
                <button type="submit" class="main-btn">ログイン</button>
            </form>

            <div class="loading" id="loading"><div class="spinner"></div></div>

            <script>
                const classOptions = {
                    1: [
                        {value: '11', text: '1組'},
                        {value: '12', text: '2組'},
                        {value: '13', text: '3組'},
                        {value: '14', text: '4組'},
                        {value: '15', text: '5組'},
                        {value: '16', text: '6組'},
                        {value: '17', text: '7組'},
                        {value: '18', text: '8組'},
                        {value: '19', text: '9組'}
                    ],
                    2: [
                        {value: '21', text: '1組'},
                        {value: '22', text: '2組'},
                        {value: '23', text: '3組'},
                        {value: '24', text: '4組'},
                        {value: '25', text: '5組'},
                        {value: '26', text: '6組'},
                        {value: '27', text: '7組'},
                        {value: '28', text: '8組'},
                        {value: '29', text: '9組'}
                    ],
                    3: [
                        {value: '31', text: '1組'},
                        {value: '32', text: '2組'},
                        {value: '33', text: '3組'},
                        {value: '34', text: '4組'},
                        {value: '35', text: '5組'},
                        {value: '36', text: '6組'},
                        {value: '37', text: '7組'},
                        {value: '38', text: '8組'},
                        {value: '39', text: '9組'}
                    ]
                };

                function updateClassOptions(grade) {
                    const select = document.getElementById('class');
                    select.innerHTML = '<option value="" disabled selected>クラスを選択</option>';

                    classOptions[grade].forEach(opt => {
                        const option = document.createElement('option');
                        option.value = opt.value;
                        option.textContent = opt.text;
                        select.appendChild(option);
                    });
                };

                document.querySelectorAll('input[name="grade"]').forEach(radio => {
                    radio.addEventListener('change', function () {
                        updateClassOptions(this.value);
                    });
                });

                updateClassOptions(document.querySelector('input[name="grade"]:checked').value);

                document.querySelector('form').addEventListener('submit', async function (p) {
                    p.preventDefault();
                    document.getElementById('loading').style.display = 'flex';
                    const classValue = document.getElementById('class').value;
                    const classS = `${classValue.charAt(0)}-${classValue.charAt(1)}`;
                    const password = document.getElementById('password').value;
                    const GAS_URL = 'https://script.google.com/macros/s/AKfycbx84V11JdsF3GyjNYuQXKp-brfvUDrw4Lon3FGIkEn6-KbWu5TJVUbDepEmDk3pnvok/exec';

                    try {
                        const res = await fetch(GAS_URL);
                        if (!res.ok) throw new Error('ネットワークエラー');
                        const users = await res.json();

                        if (Array.isArray(users)) {
                            const found = users.find(u => String(u['class']) == String(classValue) && String(u['password']) == String(password)); // 例: {class: "39", password: "furukawagumi"} または undefined
                            console.log('パスワードデバッグ情報:');
                            console.log(users);
                            console.log(found);
                            console.log(`classS: ${classS}`);
                            console.log(`class: ${classValue}, password: ${password}`);

                            if (found !== undefined) {
                                localStorage.setItem(`logged_${classValue}`, 'true');
                                window.location.href = `../class/g${classValue.charAt(0)}/${classValue}.html`;
                                return;
                            };
                        };

                        document.getElementById('loading').style.display = 'none';

                        if (!Array.isArray(users)) {
                            alert('ユーザーデータの取得に失敗しました');
                        } else {
                            alert('パスワードが違います');
                        };
                    } catch (err) {
                        document.getElementById('loading').style.display = 'none';
                        alert('サイトにアクセスできませんでした');
                    };
                });

                window.addEventListener('DOMContentLoaded', function () {
                    document.getElementById('loading').style.display = 'none';

                    for (let g = 1; g <= 3; g++) {
                        for (let c = 1; c <= 9; c++) {
                            localStorage.removeItem(`logged_${g}${c}`);
                        };
                    };
                });
            </script>
        </div>

        <p>v0.37.3</p> <!-- バージョン情報（削除予定）-->
    </body>
</html>
