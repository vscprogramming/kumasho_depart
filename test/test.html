<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>gas実行数制限検証サイト</title>
</head>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
    }

    button {
        padding: 10px 20px;
        font-size: 16px;
        margin-bottom: 18px;
        cursor: pointer;
        border-radius: 34px;
        color: white;
        background-color: orange;
    }

    #result {
        display: flex;
        flex-direction: row;
        gap: 10px;
    }

    .divs {
        flex: 1;
        margin-bottom: 0;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        background-color: #f9f9f9;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        height: 700px;
        max-height: 700px;
    }
</style>

<body>
    <button id="button">GAS実行</button>
    <div id="result">
        <div id="div1" class="divs">test1</div>
        <div id="div2" class="divs">test2</div>
        <div id="div3" class="divs">test3</div>
    </div>
    <script>
        const gasurl = [
            'https://script.google.com/macros/s/AKfycbxOjSZ5ZTZuES5HMarbCK50zs0RGNW4GfcQW8Wszc1p-CLJDvghrVq5-VinGZ052iJI6Q/exec',
            'https://script.google.com/macros/s/AKfycbxE11uBTKTaxOggR1JKIlLbqjDHQDppL25OU_ciEkJwb3sLF5y-Esl6chP-oQi4nelUsg/exec',
            'https://script.google.com/macros/s/AKfycbz1vV2zs9QLBilsQlqePGIu5glj4n9KZh7qaDxqya_6WdwY6-YgQbWHotqHa9wYIDHB/exec'
        ];

        document.getElementById('button').addEventListener('click', async () => {
            const loop = Number(prompt('ループ回数を入力してください', '35000'));
            let totalSuccess = 0, totalFail = 0, totalExec = 0;

            const [result1, result2, result3] = await Promise.all([
                gas1(gasurl[0], loop),
                gas2(gasurl[1], loop),
                gas3(gasurl[2], loop)
            ]);

            totalSuccess = result1.success + result2.success + result3.success;
            totalFail = result1.fail + result2.fail + result3.fail;
            totalExec = result1.exec + result2.exec + result3.exec;

            console.log(`全体: 成功=${totalSuccess} 失敗=${totalFail} 実行数=${totalExec}`);
            console.log(`URL1: 成功=${result1.success} 失敗=${result1.fail} 実行数=${result1.exec}`);
            console.log(`URL2: 成功=${result2.success} 失敗=${result2.fail} 実行数=${result2.exec}`);
            console.log(`URL3: 成功=${result3.success} 失敗=${result3.fail} 実行数=${result3.exec}`);
        });

        async function gas1(url, loop) {
            let success = 0, fail = 0, exec = 0;
            const promises = [];
            for (let i = 1; i <= loop; i++) {
                const time = new Date();
                promises.push(
                    fetch(url)
                        .then(res => {
                            exec++;
                            if (res.ok) success++;
                            else fail++;
                            const p = Object.assign(document.createElement('p'), {
                                innerHTML: `${time.getHours()}:${time.getMinutes()}:${time.getSeconds()}.${time.getMilliseconds()}　${i}回目の処理が完了しました（${res.ok ? '成功' : '失敗'}）<br>`
                            });
                            document.getElementById('div1').appendChild(p);
                        })
                        .catch(error => {
                            exec++;
                            fail++;
                            const p = Object.assign(document.createElement('p'), {
                                innerHTML: `${time.getHours()}:${time.getMinutes()}:${time.getSeconds()}.${time.getMilliseconds()}　${i}回目の処理が完了しました（ネットワークエラー）<br>`
                            });
                            document.getElementById('div1').appendChild(p);
                        })
                );
            }
            await Promise.all(promises);
            return { success, fail, exec };
        }

                            });
                            document.getElementById('div2').appendChild(p);
                        })
                        .catch(error => {
                            exec++;
                            fail++;
                            const p = Object.assign(document.createElement('p'), {
                                innerHTML: `${time.getHours()}:${time.getMinutes()}:${time.getSeconds()}.${time.getMilliseconds()}　${i}回目の処理が完了しました（ネットワークエラー）<br>`
                            });
                            document.getElementById('div2').appendChild(p);
                        })
                );
            }
            await Promise.all(promises);
            return { success, fail, exec };

        async function gas3(url, loop) {

                            });
                            document.getElementById('div3').appendChild(p);
                        })
                        .catch(error => {
                            exec++;

                                innerHTML: `${time.getHours()}:${time.getMinutes()}:${time.getSeconds()}.${time.getMilliseconds()}　${i}回目の処理が完了しました（ネットワークエラー）<br>`
                            });

            }
            await Promise.all(promises);

        }
    </script>
</body>

</html>
